[req]
default_bits = 2048
prompt = no
default_md = sha256
distinguished_name = dn
x509_extensions = v3_req

[dn]
C = IN
ST = Local
L = Dev
O = DigiLog
CN = localhost

[v3_req]
subjectAltName = @alt_names
basicConstraints = CA:FALSE
keyUsage = digitalSignature, keyEncipherment
extendedKeyUsage = serverAuth

[alt_names]
DNS.1 = localhost
DNS.2 = *.localhost
IP.1 = 127.0.0.1
IP.2 = ::1
IP.3 = 192.168.1.22
IP.4 = 192.168.1.50
IP.5 = 192.168.1.53
IP.6 = 192.168.1.55
IP.7 = 10.111.165.32
IP.8 = 10.115.122.32
IP.9 = 10.156.101.50
IP.10 = 10.162.206.32
