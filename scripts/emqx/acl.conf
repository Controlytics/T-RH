%%--------------------------------------------------------------------
%% DigiLog topic ACL for the bundled EMQX 5.3.2 broker.
%%
%% Rendered VERBATIM into <InstallDir>\emqx\etc\acl.conf by
%% scripts/provision-emqx.ps1 on every install and upgrade. The stock file
%% EMQX ships carries TWO allow-all rules ({allow, all}. and the 127.0.0.1
%% one) and either of them silently disables everything below — this file
%% REPLACES it, it does not patch it. Keep this in step with the dev box's
%% C:\Users\hello\emqx-5.3.2\etc\acl.conf and LOCAL_SETUP_WINDOWS.md §9A.3.
%%
%% ${clientid} is the instrument's CODE (e.g. CWH/RDU/001-00) — the auth hook
%% refuses any CONNECT whose client id is not the token's instrument code, so
%% these templates are real authorisation, not an honour system. `/` in a code
%% is reproduced literally; `+` is exactly one level, hence `#` for the bridge.
%%--------------------------------------------------------------------

{allow, {username, {re, "^dashboard$"}}, subscribe, ["$SYS/#"]}.

%% The ingest bridge (the API itself) — the only client that reads the whole tree.
{allow, {username, "digilog-bridge"}, subscribe, ["instruments/#"]}.

%% A device may publish ONLY on its own topics: telemetry, its attribute
%% report (device -> platform) and an RTC time request.
{allow, all, publish, ["instruments/${clientid}/telemetry", "instruments/${clientid}/attributes/report", "instruments/${clientid}/rtc-request"]}.

%% Every device may read the global time topic.
{allow, all, subscribe, ["digilog/rtc/time"]}.

%% DOWNLINK: the bridge is the only publisher on the attribute / children
%% trees and on the time topic.
{allow, {username, "digilog-bridge"}, publish, ["instruments/#", "digilog/rtc/time"]}.

%% A device reads its own attribute slot(s); a gateway also reads its
%% children's roster and the child attribute CHANGE event.
{allow, all, subscribe, ["instruments/${clientid}/attributes", "instruments/${clientid}/attributes/#"]}.
{allow, all, subscribe, ["instruments/${clientid}/children", "instruments/${clientid}/children/attributes"]}.

{deny, all, subscribe, ["$SYS/#", {eq, "#"}]}.
{deny, all}.
