    <!-- 2026-05-21 UI refresh: distinctive font stack. Bricolage Grotesque for
         display (operator-name, headings), Sora for body, JetBrains Mono for
         numbers/timestamps. Tablet operators are gloved + working under bright
         fluorescent light; these faces stay legible while giving the dashboard
         a deliberate, instrument-grade feel. preconnect lets the fonts arrive
         before first paint when online; offline falls back to system sans. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,300..800&family=Sora:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" />
